<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOCTIS</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NOCTIS">
<meta name="theme-color" content="#06070a">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style id="css">
:root{--bg:#06070a;--panel:#0d0f13;--panel2:#12151b;--line:#1e232c;--txt:#e7e9ec;--mute:#7c838e;--acc:#f2b705;--acc2:#ffd84d;--ok:#3ddc97;--bad:#ff5d5d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior:none;background:var(--bg);color:var(--txt);font-family:'Rajdhani',system-ui,sans-serif;font-size:17px}
body{min-height:100vh;background:radial-gradient(120% 60% at 50% 0%,#141821 0%,var(--bg) 60%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;background:repeating-linear-gradient(105deg,transparent 0 22px,#9fb3c8 22px 23px);animation:rain 1.1s linear infinite;z-index:0}
@keyframes rain{from{background-position:0 0}to{background-position:-60px 160px}}
.mono{font-family:'JetBrains Mono',monospace}
#root{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 calc(14px + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
.hero{position:relative;height:calc(210px + env(safe-area-inset-top));margin:0 -14px;overflow:hidden;border-bottom:1px solid var(--line)}
.hero svg.sky{position:absolute;bottom:0;left:0;width:100%;height:150px}
.beam{position:absolute;bottom:20px;left:62%;width:46px;height:260px;transform-origin:bottom center;background:linear-gradient(to top,rgba(242,183,5,.32),rgba(242,183,5,0));filter:blur(6px);clip-path:polygon(40% 100%,60% 100%,100% 0,0 0);animation:sweep 9s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-28deg)}to{transform:rotate(22deg)}}
.brand{position:absolute;top:calc(18px + env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start}
.logo{font-weight:700;font-size:30px;letter-spacing:.32em;line-height:1}
.logo span{color:var(--acc)}
.sub{font-size:11px;color:var(--mute);letter-spacing:.18em;margin-top:6px;text-transform:uppercase}
.sync{font-size:10px;color:var(--mute);text-align:right;letter-spacing:.08em}
.sync b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;box-shadow:0 0 8px var(--ok)}
.sync.saving b{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.sync.off b{background:var(--mute);box-shadow:none}
.term{margin:14px 0 6px;padding:12px 14px;border:1px solid var(--line);border-left:2px solid var(--acc);background:rgba(13,15,19,.85);border-radius:6px;font-size:12.5px;line-height:1.55;min-height:62px;color:#cfd3d8}
.term .p{color:var(--acc)}
.cursor{display:inline-block;width:7px;height:13px;background:var(--acc);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.h h2{margin:0;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);font-weight:600}
.h h2 i{font-style:normal;color:var(--acc)}
.daynav{display:flex;align-items:center;gap:8px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:7px 11px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc);color:#111;border-color:var(--acc)}
.btn.ghost{background:transparent}
.btn.danger{border-color:#4a2222;color:var(--bad)}
.btn[disabled]{opacity:.3}
.top{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-size:28px;line-height:1}
.ring .v small{font-size:10px;color:var(--mute);letter-spacing:.15em}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kpi small{display:block;font-size:10px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.kpi b{font-size:20px}
.habit{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.habit:last-child{border-bottom:0}
.chk{width:30px;height:30px;flex:none;border:1.5px solid #39404b;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.15s}
.habit.on .chk{background:var(--acc);border-color:var(--acc);box-shadow:0 0 14px rgba(242,183,5,.45)}
.chk svg{opacity:0}
.habit.on .chk svg{opacity:1}
.habit .t{font-size:17px;font-weight:700;letter-spacing:.03em}
.habit .s{font-size:13px;color:var(--mute);font-weight:500}
.habit.on .t{color:var(--acc2)}
.streak{margin-left:auto;font-size:11px;color:var(--mute);text-align:right;white-space:nowrap}
.streak b{color:var(--txt);font-size:15px}
.bar{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b88a00,var(--acc2))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.big{font-size:34px;font-weight:700;line-height:1}
.big small{font-size:14px;color:var(--mute);font-weight:500;margin-left:4px}
.muted{color:var(--mute);font-size:13px}
input{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:8px 10px;font:inherit;font-size:15px;min-width:0}
input:focus{outline:1px solid var(--acc)}
.list{margin-top:8px}
.li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.li:last-child{border-bottom:0}
.x{color:var(--mute);cursor:pointer;padding:2px 8px}
.dots{display:flex;gap:5px}
.dot{width:16px;height:16px;border-radius:4px;border:1px solid #39404b;cursor:pointer}
.dot.on{background:var(--acc);border-color:var(--acc)}
.skill{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.skill:last-child{border-bottom:0}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat div{aspect-ratio:1;border-radius:4px;background:#14171c;font-size:9px;color:rgba(255,255,255,.35);display:flex;align-items:flex-end;justify-content:flex-end;padding:3px;cursor:pointer}
.heat div.fut{background:transparent;border:1px dashed #1a1e25;cursor:default}
.heat div.today{outline:1px solid var(--acc)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:10px;color:var(--mute);text-align:center;margin-bottom:5px;letter-spacing:.1em}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(6,7,10,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.tabs a{flex:1;max-width:180px;text-align:center;color:var(--mute);text-decoration:none;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;padding:8px 0}
.tabs a.on{color:var(--acc)}
.tabs a svg{display:block;margin:0 auto 3px}
.confirm{margin-top:10px;padding:10px;border:1px solid #4a2222;border-radius:8px;background:#140c0c;font-size:14px}
.ro{font-size:12px;color:var(--mute);text-align:center;margin-top:10px}
</style>
</head>
<body>
<div id="root"></div>
<script id="state" type="application/json">{"v":1,"days":{"2026-11-02":{"done":["repas","lecture","retention"]}},"weights":[{"d":"2026-11-02","v":76.6}],"grades":[],"books":[],"ret":{"start":"2026-11-02","best":0},"skills":[{"n":"Vente & cold calling","l":1},{"n":"Négociation","l":0},{"n":"Copywriting & persuasion","l":0},{"n":"Finance & investissement","l":0},{"n":"Marketing digital","l":0},{"n":"Leadership & gestion","l":0}]}</script>
<script id="app">
(function(){
const FONTS='<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">';
let S=JSON.parse(document.getElementById('state').textContent);
let writable=true,mode='live',typed=false,confirmReset=false,importMsg='';
try{const l=JSON.parse(localStorage.getItem('noctis_state')||'null');if(l&&l.v===1)S=l}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const GOAL={w:65,w0:76.6,avg:14,engMin:30,books:1,scr:180};
const HABITS=[
 {id:'eng',t:'Anglais',s:'15 min grammaire + 15 min conversation'},
 {id:'etude',t:'Études',s:'Café + 30 min à 3 h de devoirs'},
 {id:'repas',t:'Alimentation',s:'Repas de qualité : protéines, légumes, eau'},
 {id:'lecture',t:'Lecture',s:'1 h de livre ou livre audio'},
 {id:'sommeil',t:'Extinction',s:'Au lit à 00h00'},
 {id:'retention',t:'Rétention',s:'Discipline maintenue aujourd’hui'},
 {id:'business',t:'Business school',s:'2 h de cours (week-end)',we:true},
 {id:'sport',t:'Entraînement',s:'Course + musculation'},
 {id:'ecran',t:'Temps d\u2019écran',s:'Moins de 3 h (hors devoirs)'}
];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const today=()=>ymd(new Date());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isWE=s=>{const g=parse(s).getDay();return g===0||g===6};
const habitsFor=s=>HABITS.filter(h=>!h.we||isWE(s));
const day=s=>S.days[s]||{done:[]};
const dayW=s=>(S.days[s]=S.days[s]||{done:[]});
const score=s=>{const hs=habitsFor(s);const d=day(s).done||[];return hs.filter(h=>d.includes(h.id)).length/hs.length};
let view=(location.hash||'').replace('#','')||'protocole';
if(!['protocole','missions','archives'].includes(view))view='protocole';
let cur=today();

function hStreak(id,we){let s=today(),n=0;if(!(day(s).done||[]).includes(id))s=add(s,-1);
 for(let i=0;i<400;i++){if(we&&!isWE(s)){s=add(s,-1);continue}if((day(s).done||[]).includes(id)){n++;s=add(s,-1)}else break}return n}
function gStreak(){let s=today(),n=0;if(score(s)<.75)s=add(s,-1);for(let i=0;i<400;i++){if(score(s)>=.75){n++;s=add(s,-1)}else break}return n}
function bestStreak(){const ks=Object.keys(S.days).sort();if(!ks.length)return 0;let s=ks[0],b=0,c=0;while(s<=today()){if(score(s)>=.75){c++;b=Math.max(b,c)}else c=0;s=add(s,1)}return b}
const lastW=()=>S.weights.length?S.weights[S.weights.length-1].v:GOAL.w0;
const avg=()=>{let a=0,c=0;S.grades.forEach(g=>{a+=g.v*g.c;c+=g.c});return c?a/c:null};
const retDays=()=>Math.max(0,diff(today(),S.ret.start));
const monday=()=>{const d=new Date();const g=(d.getDay()+6)%7;d.setDate(d.getDate()-g);return ymd(d)};
const booksWeek=()=>S.books.filter(b=>b.d>=monday()).length;
const sumLast=(k,n)=>{let t=0;for(let i=0;i<n;i++)t+=(day(add(today(),-i))[k]||0);return t};

function noctis(){
 const now=new Date(),h=now.getHours(),t=today(),hs=habitsFor(t),d=day(t).done||[];
 const done=hs.filter(x=>d.includes(x.id)).length,L=[];
 if(h>=23)L.push('Il est '+h+'h'+pad(now.getMinutes())+'. Extinction à minuit : écrans coupés, demain se gagne ce soir.');
 else if(h<5)L.push('Hors protocole. Le sommeil fait partie de la mission. Va dormir.');
 else if(h<12)L.push('Bonjour. Nouvelle nuit derrière toi, nouvelle mission devant.');
 else if(h<18)L.push('Rapport de mi-journée.');
 else L.push('Rapport du soir.');
 L.push(done+'/'+hs.length+' protocoles accomplis.');
 if(done===hs.length)L.push('Journée parfaite. La ville dort, toi tu avances.');
 else{const nx=hs.find(x=>!d.includes(x.id));if(nx)L.push('Prochaine cible : '+nx.t.toLowerCase()+'.')}
 const rest=(lastW()-GOAL.w);if(rest>0)L.push('Poids : '+rest.toFixed(1)+' kg avant la cible.');
 if(retDays()>0)L.push('Rétention : jour '+retDays()+'.');
 return L.join(' ');
}

const ck='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function ring(p){const r=44,c=2*Math.PI*r;return '<div class="ring"><svg width="104" height="104"><circle cx="52" cy="52" r="'+r+'" stroke="#1a1e25" stroke-width="8" fill="none"/><circle cx="52" cy="52" r="'+r+'" stroke="url(#g)" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-p))+'"/><defs><linearGradient id="g"><stop offset="0" stop-color="#b88a00"/><stop offset="1" stop-color="#ffd84d"/></linearGradient></defs></svg><div class="v"><b>'+Math.round(p*100)+'%</b><small>JOUR</small></div></div>'}
function hero(){
 let b='',x=0,seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
 while(x<400){const w=14+rnd()*30,h=40+rnd()*100;b+='<rect x="'+x.toFixed(0)+'" y="'+(150-h).toFixed(0)+'" width="'+w.toFixed(0)+'" height="'+h.toFixed(0)+'" fill="#0b0d11"/>';
  for(let wy=150-h+8;wy<146;wy+=11)for(let wx=x+4;wx<x+w-4;wx+=7)if(rnd()<.13)b+='<rect x="'+wx.toFixed(0)+'" y="'+wy.toFixed(0)+'" width="3" height="4" fill="#f2b705" opacity="'+(.25+rnd()*.5).toFixed(2)+'"/>';
  x+=w+1}
 const cls=mode==='live'?'':'off';
 const lbl=mode==='live'?'ENREGISTRÉ':'ERREUR STOCKAGE';
 const now=new Date();
 return '<div class="hero"><div class="beam"></div><svg class="sky" viewBox="0 0 400 150" preserveAspectRatio="none">'+b+'</svg><div class="brand"><div><div class="logo">NOCT<span>I</span>S</div><div class="sub">Système de discipline · Unité 01</div></div><div class="sync mono '+cls+'"><b></b>'+lbl+'<br>'+now.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short'}).toUpperCase()+'</div></div></div>'+
 '<div class="term mono"><span class="p">NOCTIS&gt;</span> <span id="tt"></span><span class="cursor"></span></div>';
}
function vProtocole(){
 const hs=habitsFor(cur),d=day(cur).done||[],p=score(cur),isT=cur===today();
 const lbl=isT?'Aujourd’hui':parse(cur).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'});
 let h='<div class="card"><div class="top">'+ring(p)+'<div class="kpis"><div class="kpi"><small>Série</small><b>'+gStreak()+'</b> <span class="muted">j</span></div><div class="kpi"><small>Record</small><b>'+bestStreak()+'</b> <span class="muted">j</span></div><div class="kpi"><small>Poids</small><b>'+lastW().toFixed(1)+'</b> <span class="muted">kg</span></div><div class="kpi"><small>Rétention</small><b>'+retDays()+'</b> <span class="muted">j</span></div></div></div><div class="muted" style="margin-top:8px">Série = jours à 75 % ou plus.</div></div>';
 h+='<div class="card"><div class="h"><h2>Protocole <i>·</i> '+esc(lbl)+'</h2><div class="daynav"><button class="btn ghost" data-a="prev">‹</button><button class="btn ghost" data-a="next" '+(isT?'disabled':'')+'>›</button></div></div>';
 hs.forEach(x=>{const on=d.includes(x.id);h+='<div class="habit '+(on?'on':'')+'" data-a="tog" data-id="'+x.id+'"><div class="chk">'+ck+'</div><div><div class="t">'+x.t+'</div><div class="s">'+x.s+'</div></div><div class="streak"><b>'+hStreak(x.id,x.we)+'</b><br>série</div></div>'});
 h+='</div>';
 return h;
}
function spark(){
 const w=S.weights.slice(-20);if(w.length<2)return '';
 const vs=w.map(p=>p.v).concat([GOAL.w]),mn=Math.min(...vs)-.5,mx=Math.max(...vs)+.5,W=300,H=70;
 const X=i=>i*(W/(w.length-1)),Y=v=>H-(v-mn)/(mx-mn)*H;
 const pts=w.map((p,i)=>X(i).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ');
 return '<svg viewBox="0 0 300 70" width="100%" height="70" style="margin-top:6px"><line x1="0" x2="300" y1="'+Y(GOAL.w)+'" y2="'+Y(GOAL.w)+'" stroke="#3ddc97" stroke-dasharray="4 4" opacity=".6"/><polyline points="'+pts+'" fill="none" stroke="#f2b705" stroke-width="2"/></svg>';
}
function vMissions(){
 const t=today(),td=day(t);
 const lw=lastW(),pw=Math.max(0,Math.min(1,(GOAL.w0-lw)/(GOAL.w0-GOAL.w)));
 let h='<div class="card"><div class="h"><h2>Mission <i>01</i> · Poids</h2><span class="muted">cible 65 kg</span></div><div class="big">'+lw.toFixed(1)+'<small>kg</small></div><div class="bar"><i style="width:'+(pw*100)+'%"></i></div><div class="muted">'+(GOAL.w0-lw).toFixed(1)+' kg perdus · encore '+Math.max(0,lw-GOAL.w).toFixed(1)+' kg</div>'+spark()+'<div class="row" style="margin-top:10px"><input id="wIn" type="number" step="0.1" inputmode="decimal" placeholder="Pesée du jour (kg)" style="flex:1"><button class="btn acc" data-a="addW">Enregistrer</button></div><div class="muted" style="margin-top:6px">Pèse-toi le matin, à jeun, 2 à 3 fois par semaine : la tendance compte, pas le chiffre d’un jour.</div></div>';
 const a=avg();
 h+='<div class="card"><div class="h"><h2>Mission <i>02</i> · Moyenne</h2><span class="muted">cible 14/20</span></div><div class="big" style="color:'+(a===null?'var(--txt)':a>=14?'var(--ok)':'var(--acc)')+'">'+(a===null?'—':a.toFixed(2))+'<small>/20</small></div><div class="bar"><i style="width:'+(a===null?0:Math.min(100,a/14*100))+'%"></i></div>';
 if(a!==null)h+='<div class="muted">'+(a>=14?'Objectif atteint. Tiens la ligne.':'Il manque '+(14-a).toFixed(2)+' point(s).')+'</div>';
 h+='<div class="row" style="margin-top:10px"><input id="gM" placeholder="Matière" style="flex:2"><input id="gV" type="number" step="0.25" inputmode="decimal" placeholder="Note" style="width:72px"><input id="gC" type="number" step="0.5" inputmode="decimal" placeholder="Coef" style="width:64px"><button class="btn acc" data-a="addG">+</button></div><div class="list">';
 S.grades.slice().reverse().slice(0,8).forEach((g,i)=>{const idx=S.grades.length-1-i;h+='<div class="li"><span>'+esc(g.m)+' <span class="muted">coef '+g.c+'</span></span><span><b>'+g.v+'</b> <span class="x" data-a="delG" data-i="'+idx+'">×</span></span></div>'});
 h+='</div></div>';
 const em=td.engMin||0;
 h+='<div class="card"><div class="h"><h2>Mission <i>03</i> · Anglais</h2><span class="muted">30 min / jour</span></div><div class="big">'+em+'<small>min aujourd’hui</small></div><div class="bar"><i style="width:'+Math.min(100,em/GOAL.engMin*100)+'%"></i></div><div class="row"><button class="btn" data-a="eng" data-v="-15">−15</button><button class="btn acc" data-a="eng" data-v="15">+15 min</button><span class="muted" style="margin-left:auto">7 j : '+sumLast('engMin',7)+' min · série '+hStreak('eng')+' j</span></div></div>';
 h+='<div class="card"><div class="h"><h2>Mission <i>04</i> · Rétention</h2><span class="muted">record '+Math.max(S.ret.best,retDays())+' j</span></div><div class="big">'+retDays()+'<small>jours</small></div><div class="row" style="margin-top:10px"><span class="muted">Début de la série</span><input id="rS" type="date" value="'+S.ret.start+'" max="'+t+'" style="flex:1"></div><div class="row" style="margin-top:8px"><button class="btn danger" data-a="rAsk">Réinitialiser</button></div>'+(confirmReset?'<div class="confirm">Remettre le compteur à zéro ? Le record est conservé.<div class="row" style="margin-top:8px"><button class="btn danger" data-a="rYes">Oui, repartir</button><button class="btn" data-a="rNo">Annuler</button></div></div>':'')+'</div>';
 const bw=booksWeek();
 h+='<div class="card"><div class="h"><h2>Mission <i>05</i> · Lecture</h2><span class="muted">1 livre / semaine</span></div><div class="big" style="color:'+(bw>=1?'var(--ok)':'var(--txt)')+'">'+bw+'<small>/ 1 cette semaine</small></div><div class="muted" style="margin-top:4px">'+S.books.length+' livre(s) terminé(s) au total</div><div class="row" style="margin-top:10px"><input id="bT" placeholder="Titre du livre terminé" style="flex:1"><button class="btn acc" data-a="addB">+</button></div><div class="list">';
 S.books.slice().reverse().slice(0,6).forEach((b,i)=>{const idx=S.books.length-1-i;h+='<div class="li"><span>'+esc(b.t)+'</span><span class="muted">'+parse(b.d).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' <span class="x" data-a="delB" data-i="'+idx+'">×</span></span></div>'});
 h+='</div></div>';
 const sm=td.skMin||0;
 h+='<div class="card"><div class="h"><h2>Mission <i>06</i> · Compétences</h2><span class="muted">niveau 0–5</span></div><div class="row"><div class="big">'+sm+'<small>min aujourd’hui</small></div><span class="muted" style="margin-left:auto">7 j : '+sumLast('skMin',7)+' min</span></div><div class="row" style="margin:10px 0"><button class="btn" data-a="sk" data-v="-15">−15</button><button class="btn acc" data-a="sk" data-v="15">+15 min</button></div>';
 S.skills.forEach((s,i)=>{let ds='';for(let k=1;k<=5;k++)ds+='<span class="dot '+(s.l>=k?'on':'')+'" data-a="lvl" data-i="'+i+'" data-v="'+k+'"></span>';h+='<div class="skill"><span>'+esc(s.n)+'</span><div class="dots">'+ds+'</div></div>'});
 h+='</div>';
 const sc=td.scr,fmt=m=>Math.floor(m/60)+' h '+pad(m%60);
 let n7=0,t7=0;for(let i=1;i<=7;i++){const v=day(add(t,-i)).scr;if(v!=null){n7++;t7+=v}}
 h+='<div class="card"><div class="h"><h2>Mission <i>07</i> · Écran</h2><span class="muted">max 3 h / jour</span></div><div class="big" style="color:'+(sc==null?'var(--txt)':sc<=GOAL.scr?'var(--ok)':'var(--bad)')+'">'+(sc==null?'—':fmt(sc))+'<small>aujourd\u2019hui</small></div><div class="bar"><i style="width:'+(sc==null?0:Math.min(100,sc/GOAL.scr*100))+'%;'+(sc>GOAL.scr?'background:var(--bad)':'')+'"></i></div><div class="muted">'+(n7?'Moyenne 7 j : '+fmt(Math.round(t7/n7)):'Pas encore de données sur 7 jours')+'</div><div class="row" style="margin-top:10px"><input id="sH" type="number" min="0" max="24" inputmode="numeric" placeholder="h" style="width:64px"><input id="sM" type="number" min="0" max="59" inputmode="numeric" placeholder="min" style="width:72px"><button class="btn acc" data-a="addS">Enregistrer</button></div><div class="muted" style="margin-top:6px">Le soir, recopie le chiffre de Réglages › Temps d\u2019écran. Sous 3 h, le protocole se coche seul.</div></div>';
 return h;
}
function vArchives(){
 const t=today(),g=(parse(t).getDay()+6)%7,end=add(t,6-g),start=add(end,-41);
 let h='<div class="card"><div class="h"><h2>Archives <i>·</i> 6 semaines</h2></div><div class="wk mono"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="heat">';
 for(let s=start;s<=end;s=add(s,1)){
  if(s>t){h+='<div class="fut"></div>';continue}
  const p=S.days[s]?score(s):0;const bg=p?'rgba(242,183,5,'+(0.15+p*.85).toFixed(2)+')':'#14171c';
  h+='<div data-a="go" data-d="'+s+'" class="'+(s===t?'today':'')+'" style="background:'+bg+'">'+parse(s).getDate()+'</div>'}
 h+='</div><div class="muted" style="margin-top:8px">Touche un jour pour le corriger.</div></div>';
 let s7=0;for(let i=0;i<7;i++)s7+=score(add(t,-i));
 const total=Object.keys(S.days).filter(k=>score(k)>0).length;
 h+='<div class="card"><div class="h"><h2>Statistiques</h2></div><div class="kpis"><div class="kpi"><small>Moy. 7 jours</small><b>'+Math.round(s7/7*100)+'%</b></div><div class="kpi"><small>Jours actifs</small><b>'+total+'</b></div><div class="kpi"><small>Série actuelle</small><b>'+gStreak()+' j</b></div><div class="kpi"><small>Record</small><b>'+bestStreak()+' j</b></div></div></div>';
 h+='<div class="card"><div class="h"><h2>Constance par habitude <i>·</i> 30 j</h2></div>';
 HABITS.forEach(x=>{let n=0,c=0;for(let i=0;i<30;i++){const s=add(t,-i);if(x.we&&!isWE(s))continue;n++;if((day(s).done||[]).includes(x.id))c++}
  const p=n?c/n:0;h+='<div class="skill"><span>'+x.t+'</span><span class="mono" style="font-size:13px;color:'+(p>=.8?'var(--ok)':p>=.5?'var(--acc)':'var(--mute)')+'">'+Math.round(p*100)+'%</span></div>'});
 h+='</div>';
 h+='<div class="card"><div class="h"><h2>Sauvegarde</h2></div><div class="muted">Tes données sont stockées uniquement sur ce téléphone. Exporte une copie de temps en temps (dans Fichiers) pour ne jamais rien perdre.</div><div class="row" style="margin-top:10px"><button class="btn acc" data-a="exp">Exporter</button><label class="btn" style="display:inline-block">Importer<input id="imp" type="file" accept=".json,application/json" style="display:none"></label></div>'+(importMsg?'<div class="muted" style="margin-top:8px;color:var(--acc)">'+esc(importMsg)+'</div>':'')+'</div>';
 return h;
}
const ic={protocole:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',missions:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',archives:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/>'};
function render(){
 let h=hero();
 h+=view==='protocole'?vProtocole():view==='missions'?vMissions():vArchives();
 if(!writable)h+='<div class="ro">Lecture seule : tu n’as pas les droits d’écriture sur cette page.</div>';
 h+='<nav class="tabs">'+['protocole','missions','archives'].map(v=>'<a href="#'+v+'" data-a="tab" data-v="'+v+'" class="'+(view===v?'on':'')+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ic[v]+'</svg>'+v+'</a>').join('')+'</nav>';
 document.getElementById('root').innerHTML=h;
 const msg=noctis(),el=document.getElementById('tt');
 if(typed){el.textContent=msg}else{typed=true;let i=0;const tick=()=>{if(!document.getElementById('tt'))return;document.getElementById('tt').textContent=msg.slice(0,i);if(i++<msg.length)setTimeout(tick,16)};tick()}
}
function save(){
 try{localStorage.setItem('noctis_state',JSON.stringify(S));mode='live'}catch(e){mode='err'}
 render();
}
function exportData(){
 const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='noctis-sauvegarde-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1000);
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
 if(a==='tab'){e.preventDefault();view=el.dataset.v;try{history.replaceState(null,'','#'+view)}catch(_){location.hash=view}render();window.scrollTo(0,0);return}
 if(a==='prev'){cur=add(cur,-1);render();return}
 if(a==='next'){if(cur<today())cur=add(cur,1);render();return}
 if(a==='go'){cur=el.dataset.d;view='protocole';try{history.replaceState(null,'','#protocole')}catch(_){}render();window.scrollTo(0,0);return}
 if(a==='rAsk'){confirmReset=true;render();return}
 if(a==='rNo'){confirmReset=false;render();return}
 if(a==='exp'){exportData();return}
 if(!writable)return;
 const t=today();
 if(a==='tog'){const d=dayW(cur);d.done=d.done||[];const id=el.dataset.id,i=d.done.indexOf(id);if(i<0)d.done.push(id);else d.done.splice(i,1);save()}
 else if(a==='addW'){const v=parseFloat(document.getElementById('wIn').value.replace(',','.'));if(!(v>30&&v<250))return;S.weights=S.weights.filter(w=>w.d!==t);S.weights.push({d:t,v:v});S.weights.sort((x,y)=>x.d<y.d?-1:1);save()}
 else if(a==='addG'){const m=document.getElementById('gM').value.trim(),v=parseFloat(document.getElementById('gV').value.replace(',','.')),c=parseFloat((document.getElementById('gC').value||'1').replace(',','.'));if(!m||!(v>=0&&v<=20)||!(c>0))return;S.grades.push({m:m.slice(0,40),v:v,c:c});save()}
 else if(a==='delG'){S.grades.splice(+el.dataset.i,1);save()}
 else if(a==='eng'){const d=dayW(t);d.engMin=Math.max(0,(d.engMin||0)+(+el.dataset.v));d.done=d.done||[];if(d.engMin>=30&&!d.done.includes('eng'))d.done.push('eng');save()}
 else if(a==='addS'){const hh=parseInt(document.getElementById('sH').value||'0',10),mm=parseInt(document.getElementById('sM').value||'0',10);const m=hh*60+mm;if(!(m>=0&&m<=1440)||isNaN(m))return;const d=dayW(t);d.scr=m;d.done=d.done||[];const i=d.done.indexOf('ecran');if(m<=GOAL.scr&&i<0)d.done.push('ecran');if(m>GOAL.scr&&i>=0)d.done.splice(i,1);save()}
 else if(a==='sk'){const d=dayW(t);d.skMin=Math.max(0,(d.skMin||0)+(+el.dataset.v));save()}
 else if(a==='lvl'){const s=S.skills[+el.dataset.i],v=+el.dataset.v;s.l=s.l===v?v-1:v;save()}
 else if(a==='rYes'){S.ret.best=Math.max(S.ret.best,retDays());S.ret.start=t;confirmReset=false;save()}
 else if(a==='addB'){const b=document.getElementById('bT').value.trim();if(!b)return;S.books.push({t:b.slice(0,80),d:t});save()}
 else if(a==='delB'){S.books.splice(+el.dataset.i,1);save()}
});
document.addEventListener('change',e=>{if(e.target.id==='imp'&&e.target.files[0]){const f=e.target.files[0],r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d&&d.v===1&&d.days){S=d;importMsg='Import réussi.';save()}else{importMsg='Fichier invalide.';render()}}catch(_){importMsg='Fichier invalide.';render()}};r.readAsText(f);return}if(e.target.id==='rS'&&writable&&e.target.value&&e.target.value<=today()){S.ret.best=Math.max(S.ret.best,retDays());S.ret.start=e.target.value;save()}});
window.addEventListener('hashchange',()=>{const v=location.hash.replace('#','');if(['protocole','missions','archives'].includes(v)){view=v;render()}});
render();
setInterval(()=>{const tt=document.getElementById('tt');if(tt&&typed)tt.textContent=noctis()},60000);
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
})();
</script>
</body>
</html>
